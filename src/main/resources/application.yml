server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_calc
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    secret: finance-calc-secret-key-change-in-production
    expiration-ms: 3600000
