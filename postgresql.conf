# Пример оптимизации под 4GB RAM
listen_addresses = '*'
max_connections = 100
shared_buffers = 512MB                   # 25% от RAM (основной кэш данных)
effective_cache_size = 1536MB            # 75% от RAM (оценка для планировщика)
work_mem = 8MB                           # Память на операцию сортировки/хэша
maintenance_work_mem = 128MB             # Память для VACUUM, CREATE INDEX
wal_buffers = 16MB                       # Буфер WAL (1/32 от shared_buffers)

# Логирование
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d                    # Ротация логов каждый день
log_rotation_size = 100MB                # Или при достижении 100MB
log_min_duration_statement = 1000        # Логировать запросы > 1 сек
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d '
log_statement = 'ddl'                    # Логировать DDL (CREATE, ALTER)
log_timezone = 'UTC'
